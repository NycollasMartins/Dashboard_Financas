name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Typecheck, lint e testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  banco-e-e2e:
    name: RLS (pgTAP) e E2E (iPhone / Android / desktop)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: pnpm install --frozen-lockfile
      - name: Supabase local
        run: pnpm db:start
      - name: Testes de RLS
        run: pnpm test:db
      - name: Chave publicável local (integração e E2E)
        run: |
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(supabase status -o env | grep '^PUBLISHABLE_KEY=' | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"
          # Chave secreta do Supabase LOCAL do CI (efêmero) — mascarada nos logs.
          SK=$(supabase status -o env | grep '^SECRET_KEY=' | cut -d= -f2- | tr -d '\"'); echo "::add-mask::$SK"; echo "SUPABASE_SECRET_KEY=$SK" >> "$GITHUB_ENV"
      - name: Integração do assistente (mensagem → banco)
        run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps webkit chromium
      - name: E2E
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    name: Imagem Docker (build + healthcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (valores públicos fictícios; segredos nunca entram na imagem)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: larmais:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://exemplo.supabase.co
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_placeholder_000000
            NEXT_PUBLIC_SITE_URL=https://larmais.tech
            APP_VERSION=${{ github.sha }}
      - name: Sobe o contêiner e espera ficar saudável
        run: |
          docker run -d --name larmais -p 3000:3000 larmais:ci
          for i in $(seq 1 30); do
            s=$(docker inspect --format '{{.State.Health.Status}}' larmais); echo "health: $s"
            [ "$s" = healthy ] && break; sleep 3
          done
          curl -fsS http://127.0.0.1:3000/api/health
          test "$(docker exec larmais whoami)" = nextjs
          docker images larmais:ci --format 'Tamanho: {{.Size}}'
