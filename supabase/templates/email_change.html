<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;padding:32px 16px;background:#0b0d12;font-family:Inter,Segoe UI,Arial,sans-serif;color:#e6e8ef">
    <table role="presentation" width="100%" style="max-width:480px;margin:0 auto;background:#12151d;border:1px solid #232838;border-radius:16px">
      <tr><td style="padding:32px">
        <p style="margin:0 0 8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#5eead4">Finanças</p>
        <h1 style="margin:0 0 16px;font-size:22px;color:#ffffff">Confirme seu novo e-mail</h1>
        <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#a9afc2">Toque no botão abaixo para confirmar a alteração do e-mail da sua conta.</p>
        <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email_change&next={{ .RedirectTo }}"
           style="display:inline-block;padding:12px 20px;border-radius:10px;background:#5eead4;color:#04201b;font-weight:600;text-decoration:none">Confirmar novo e-mail</a>
        <p style="margin:24px 0 0;font-size:12px;line-height:1.6;color:#6b7186">Se você não fez essa solicitação, ignore este e-mail. O link expira em 1 hora.</p>
      </td></tr>
    </table>
  </body>
</html>
